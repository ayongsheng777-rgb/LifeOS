name: 邮件助手
description: 邮件助手（系统默认内置技能，基于本机已授权的 Agent Mail / agently-cli）：查收件箱 / 看未读 / 搜索邮件 / 读邮件正文（说「读第3封」即可，无需复制长 ID）/ 发邮件。用法：① 查收件箱 ② 看未读邮件 ③ 搜索 报告 ④ 读第3封 ⑤ 发邮件给 alice@x.com 主题 周报 内容 本周进展。
